<!doctype html><html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caption Studio</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#eceaff">
<style>
:root{--bg:#eceaff;--card:#fff;--ink:#15103d;--acc:#5b3df5;--hot:#ff5a36;--mut:#6b6794;--ln:#d9d4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 6px}
header b{font:900 22px/1 "Arial Black",system-ui,sans-serif;letter-spacing:-.5px}header b i{color:var(--acc);font-style:normal}
header span{font-size:12px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px}
.stage{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 16px 8px}
.screen{position:relative;display:flex;justify-content:center;background:#0d0a26;border-radius:22px;padding:8px;box-shadow:0 10px 30px #5b3df533}
canvas#c{max-width:100%;max-height:40vh;border-radius:16px;display:block}
#big{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:0;background:#ffffffd9;font-size:26px;color:var(--acc)}
.sc{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut)}.sc input{flex:1;accent-color:var(--acc)}
#st{padding:0 16px;min-height:20px;font-size:13px;color:var(--acc);font-weight:700}
.p{display:none;padding:6px 16px}.p.on{display:block}
.card{background:var(--card);border-radius:20px;padding:14px;margin:0 0 12px;border:1px solid var(--ln)}
.card h3{margin:0 0 8px;font-size:15px}
label.drop{display:block;text-align:center;padding:22px 10px;border:2px dashed var(--acc);border-radius:16px;color:var(--acc);font-weight:700}
label.drop input{display:none}
select,input[type=password],textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:#f8f7ff;color:var(--ink);margin:4px 0}
textarea{height:110px}
button.b{width:100%;padding:13px;border:0;border-radius:14px;font:800 15px inherit;background:#e6e1ff;color:var(--acc);margin:4px 0}
button.b.hot{background:var(--hot);color:#fff}button.b.pri{background:var(--acc);color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chips button{border:1px solid var(--ln);background:#fff;border-radius:99px;padding:7px 14px;font:700 13px inherit;color:var(--ink);white-space:nowrap}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{background:#fff;border:2px solid transparent;border-radius:14px;padding:4px;text-align:center;font-size:11px;font-weight:700}
.t canvas{width:100%;border-radius:10px;display:block}.t.on{border-color:var(--acc)}
.rg{display:block;margin:8px 0;font-weight:700;font-size:13px}.rg input{width:100%;accent-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;border:0;background:none;font:700 11px inherit;color:var(--mut);padding:6px 0}nav button span{display:block;font-size:20px}
nav button.on{color:var(--acc)}
</style></head><body>
<header><b>Caption<i>Studio</i></b><span id="cnt"></span></header>
<div class="stage"><div class="screen"><canvas id="c" width="720" height="1280"></canvas><button id="big">▶</button></div>
<div class="sc"><span id="tm">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="du">0:00</span></div></div>
<video id="v" playsinline style="display:none"></video><div id="st"></div>

<div class="p on" id="p0">
<div class="card"><label class="drop">Video chuno<input type="file" id="f" accept="video/*"></label></div>
<div class="card"><h3>Captions kaise banayein</h3>
<select id="mode"><option value="local">Offline Whisper (free, phone par chalta hai)</option><option value="groq">Free API (Groq, tez aur accurate)</option></select>
<select id="model"><option value="Xenova/whisper-base">Model: Base (~80MB, tez)</option><option value="Xenova/whisper-small">Model: Small (~250MB, behtar Hindi)</option><option value="Xenova/whisper-tiny">Model: Tiny (~40MB, sabse tez)</option></select>
<input id="key" type="password" placeholder="Groq API key (sirf API mode ke liye)">
<select id="lang"><option value="hi">Bolna: Hindi / Urdu / Hinglish</option><option value="en">Bolna: English</option><option value="">Auto detect</option></select>
<select id="scr"><option value="rom">Likhna: Hinglish (Roman)</option><option value="dev">Likhna: Hindi (देवनागरी)</option></select>
<button class="b pri" id="go">Captions generate karo</button></div>
<div class="card"><h3>Text theek karo</h3><textarea id="tx" placeholder="Captions yahan aayenge. Har line = ek group."></textarea><button class="b" id="ap">Text lagao</button></div></div>

<div class="p" id="p1"><div class="chips" id="ch"></div><div class="grid" id="gr"></div></div>

<div class="p" id="p2"><div class="card"><h3>Caption style</h3>
<label class="rg">Size<input type="range" id="s1" min="4" max="14" value="7.5" step=".5"></label>
<label class="rg">Upar / neeche<input type="range" id="s2" min="15" max="90" value="72"></label>
<label class="rg">Ek baar mein words<input type="range" id="s3" min="1" max="5" value="3"></label>
<label class="rg">Highlight color <input type="color" id="s4" value="#ffd23f"></label>
<button class="b" id="rs">Template ka asli color</button></div></div>

<div class="p" id="p3"><div class="card"><h3>Export</h3>
<button class="b hot" id="ex">Captions wali video banao</button>
<div class="row"><button class="b" id="srt">SRT</button><button class="b" id="txt">TXT</button></div>
<p style="color:var(--mut);font-size:13px">Video export real-time chalta hai: jitni lambi video, utna time. Export ke dauran app khula rakho.</p></div></div>

<nav id="nv"><button class="on" data-p="0"><span>🎙</span>Captions</button><button data-p="1"><span>✨</span>Templates</button><button data-p="2"><span>🎚</span>Style</button><button data-p="3"><span>⬇</span>Export</button></nav>
